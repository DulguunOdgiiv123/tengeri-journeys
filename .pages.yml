# Admin panel for goldenjigutour.com, run by Pages CMS (https://app.pagescms.org).
# Each content entry below is one data/*.json file; index.html loads those files when the page opens.
# Every field stored in a file must be listed here: Pages CMS drops unknown fields when it saves.

media:
  input: img
  output: img
  categories: [image]

components:
  pair:          # one line of text in English and Korean
    type: object
    fields:
      - { name: en, label: English, type: string }
      - { name: ko, label: Korean, type: string }
  pairText:      # longer text in English and Korean
    type: object
    fields:
      - { name: en, label: English, type: text }
      - { name: ko, label: Korean, type: text }
  month:
    type: select
    options:
      values:
        - { value: "1", label: January }
        - { value: "2", label: February }
        - { value: "3", label: March }
        - { value: "4", label: April }
        - { value: "5", label: May }
        - { value: "6", label: June }
        - { value: "7", label: July }
        - { value: "8", label: August }
        - { value: "9", label: September }
        - { value: "10", label: October }
        - { value: "11", label: November }
        - { value: "12", label: December }
  region:
    type: select
    options:
      values:
        - { value: gobi, label: Gobi Desert }
        - { value: north, label: "Khövsgöl & north" }
        - { value: central, label: Central steppe }
        - { value: west, label: "Altai & far west" }
        - { value: winter, label: Winter }

content:
  - name: tours
    label: Tours
    description: Every tour on the site, in the order they are listed.
    type: file
    path: data/tours.json
    format: json
    fields:
      - name: tours
        label: Tours
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} ({days} days)"
        fields:
          - name: id
            label: Tour ID
            type: string
            required: true
            description: "Short code used in links, e.g. gobi-4n5d. Don't change it once the tour is live."
            pattern: { regex: "^[a-z0-9-]+$", message: "Use lowercase letters, numbers and dashes only." }
          - { name: name, label: Name (English), type: string, required: true }
          - { name: tag, label: Badge (English), type: string, description: "Short label on the tour card, e.g. Most popular" }
          - { name: text, label: Summary (English), type: text }
          - { name: days, label: Days, type: number, required: true, options: { min: 1 } }
          - { name: season, label: Season text (English), type: string, description: "e.g. May–Oct" }
          - name: level
            label: Difficulty (English)
            type: select
            options: { values: [Easy, Moderate, Challenging] }
          - { name: img, label: Photo, type: image }
          - name: cats
            label: Categories
            type: select
            options:
              multiple: true
              values:
                - { value: gobi, label: Gobi Desert }
                - { value: north, label: "Khövsgöl & north" }
                - { value: central, label: Central steppe }
                - { value: west, label: "Altai & far west" }
                - { value: winter, label: Winter }
                - { value: festival, label: Festivals }
                - { value: short, label: Short trip }
          - { name: months, label: Months the tour runs, component: month, options: { multiple: true } }
          - { name: cafe, label: Naver cafe post link, type: string }
          - { name: art, label: Naver cafe post number, type: number }
          - name: route
            label: Route on the map
            type: string
            list: true
            description: "Overnight stops in order, using the IDs from Map stops (e.g. ub, tsagaan, bayanzag, ub). Put ~ in front of a stop reached by domestic flight (e.g. ~murun)."
          - name: team
            label: Price per person by team size
            description: "Leave empty to show 'Ask for a quote'."
            type: object
            list: true
            fields:
              - { name: n, label: Team size (people), type: number }
              - { name: krw, label: Price per person (₩), type: number }
          - name: ko
            label: Korean
            type: object
            fields:
              - { name: name, label: Name (Korean), type: string }
              - { name: tag, label: Badge (Korean), type: string }
              - { name: text, label: Summary (Korean), type: text }
              - { name: season, label: Season text (Korean), type: string, description: "e.g. 5–10월" }
              - name: level
                label: Difficulty (Korean)
                type: select
                options: { values: [쉬움, 보통, 어려움] }
          - name: schedule
            label: Day-by-day schedule
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "Day {index}: {place.en}"
            fields:
              - { name: place, label: Place, component: pair }
              - { name: hours, label: Drive hours, type: string, description: "e.g. 5 or 8–9. Leave empty if there is no drive." }
              - name: times
                label: Timetable
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{time} {en}"
                fields:
                  - { name: time, label: Time, type: string, description: "e.g. 08:00. Leave empty for a note line." }
                  - { name: en, label: English, type: text }
                  - { name: ko, label: Korean, type: text }
              - name: stay
                label: Overnight
                type: object
                fields:
                  - name: type
                    label: Lodging type
                    type: select
                    description: "Leave empty on the last day (no overnight)."
                    options:
                      values:
                        - { value: ger, label: Tourist ger camp }
                        - { value: hotel, label: Hotel }
                        - { value: gerhouse, label: Ger guesthouse }
                        - { value: nomad, label: Nomad family ger }
                  - { name: camp, label: Camp name (optional), type: string }
                  - { name: shower, label: Shower, type: boolean }
                  - { name: power, label: Electricity, type: boolean }
                  - { name: wifi, label: Internet, type: boolean }
              - { name: meals, label: Meals, component: pair }
              - { name: notes, label: Notes, component: pair, list: true }
              - { name: drop, label: Ends with drop-off at the hotel or airport, type: boolean }
              - { name: shop, label: Shopping depends on the flight time, type: boolean }
          - name: alt
            label: Other day orders (different flight times)
            description: "One row per day. Each row lists that day's stop for option A, B, C."
            type: object
            list: true
            fields:
              - { name: options, label: "Stops (A, B, C)", component: pair, list: true }

  - name: lodges
    label: Lodges
    description: Camps and hotels shown under each stop in the tour details.
    type: file
    path: data/lodges.json
    format: json
    fields:
      - name: lodges
        label: Lodges
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} ({stop}, {tier})"
        fields:
          - { name: id, label: Lodge ID, type: string, required: true, description: "Unique code, e.g. tsagaan-goviin-hulan-camp" }
          - { name: name, label: Name, type: string, required: true }
          - { name: stop, label: Map stop ID, type: string, required: true, description: "The stop this lodge belongs to, from Map stops (e.g. tsagaan)." }
          - name: tier
            label: Tier
            type: select
            required: true
            options:
              values:
                - { value: standard, label: "Standard (included in the quote)" }
                - { value: upgrade, label: "Upgrade (extra cost)" }
                - { value: budget, label: "Budget (₩30,000 off)" }
          - name: season
            label: Open
            type: select
            required: true
            options:
              values:
                - { value: summer, label: Summer only }
                - { value: all, label: "All year (also shown on winter tours)" }
          - { name: type, label: Lodging type, component: pair }
          - { name: lat, label: Latitude, type: number, description: "In Google Maps, right-click the place and click the numbers to copy them. Leave empty if unknown." }
          - { name: lon, label: Longitude, type: number }
          - { name: price, label: Price note (optional), component: pair }
          - { name: about, label: About (optional), component: pairText }
          - name: fac
            label: Facilities (leave empty if unknown)
            type: object
            fields:
              - { name: shower, label: Shower, type: select, options: { values: ["yes", "no"] } }
              - { name: private_bath, label: Private bathroom, type: select, options: { values: ["yes", "no"] } }
              - { name: power, label: Electricity, type: select, options: { values: ["yes", "no"] } }
              - { name: wifi, label: Wi-Fi, type: select, options: { values: ["yes", "no"] } }
              - { name: restaurant, label: Restaurant, type: select, options: { values: ["yes", "no"] } }
          - { name: url, label: Website (optional), type: string }
          - { name: phone, label: Phone (optional), type: string }
          - { name: photo, label: Photo link (optional), type: string }

  - name: places
    label: Map stops
    description: Places used in tour routes and lodges. Each needs an ID and map coordinates.
    type: file
    path: data/places.json
    format: json
    fields:
      - name: places
        label: Stops
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} ({id})"
        fields:
          - name: id
            label: Stop ID
            type: string
            required: true
            description: "Short code used in tour routes, e.g. tsagaan. Don't change it while tours use it."
            pattern: { regex: "^[a-z0-9]+$", message: "Use lowercase letters and numbers only." }
          - { name: name, label: Name (English), type: string, required: true }
          - { name: ko, label: Name (Korean), type: string }
          - { name: lat, label: Latitude, type: number, required: true }
          - { name: lon, label: Longitude, type: number, required: true }
          - { name: cap, label: Capital city (Ulaanbaatar only), type: boolean }

  - name: policy
    label: Included and safety notes
    description: Lists shown on every tour.
    type: file
    path: data/policy.json
    format: json
    fields:
      - { name: incl, label: Included in every tour, component: pair, list: true }
      - { name: excl, label: Not included, component: pair, list: true }
      - { name: notes, label: Safety notes, component: pairText, list: true }

  - name: seasons
    label: Seasons
    type: file
    path: data/seasons.json
    format: json
    fields:
      - name: seasons
        label: Seasons
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{en}"
        fields:
          - { name: en, label: Name (English), type: string, required: true }
          - { name: ko, label: Name (Korean), type: string }
          - { name: from, label: First month, component: month, required: true }
          - { name: to, label: Last month, component: month, required: true }
          - { name: img, label: Photo, type: image }
          - { name: text, label: Text (English), type: text }
          - { name: textKo, label: Text (Korean), type: text }
          - { name: peak, label: Peak season badge, type: boolean }

  - name: faq
    label: FAQ
    type: file
    path: data/faq.json
    format: json
    fields:
      - name: questions
        label: Questions
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{q}"
        fields:
          - name: c
            label: Category
            type: select
            required: true
            options:
              values:
                - { value: booking, label: "Booking & payment" }
                - { value: entry, label: "Visa & arrival" }
                - { value: trip, label: On the trip }
                - { value: safety, label: "Health & safety" }
                - { value: winter, label: Winter travel }
          - { name: q, label: Question (English), type: string, required: true }
          - { name: a, label: Answer (English), type: text, description: "Press Enter for a new line." }
          - name: ko
            label: Korean
            type: object
            fields:
              - { name: q, label: Question (Korean), type: string }
              - { name: a, label: Answer (Korean), type: text }
          - { name: id, label: Link ID (optional), type: string, description: "Only needed if another part of the site links to this question." }
      - name: categories
        label: Category names
        description: "To add a new category, the Category list in .pages.yml needs it too."
        type: object
        list: true
        fields:
          - { name: id, label: Category ID, type: string, required: true }
          - { name: name, label: Name (English), type: string }
          - name: ko
            label: Korean
            type: object
            fields:
              - { name: name, label: Name (Korean), type: string }

  - name: posts
    label: Traveller posts
    description: Blog and cafe trip diaries about us, shown as link cards.
    type: file
    path: data/posts.json
    format: json
    fields:
      - name: posts
        label: Posts
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{date} {title}"
        fields:
          - name: src
            label: Source
            type: select
            required: true
            options:
              values:
                - { value: blog, label: Naver blog }
                - { value: cafe, label: Naver cafe }
                - { value: brunch, label: Brunch }
          - { name: url, label: Post link, type: string, required: true }
          - { name: title, label: Title, type: string, required: true }
          - { name: by, label: Author nickname, type: string }
          - { name: date, label: Date posted, type: date }
          - { name: region, label: Region, component: region }
          - { name: img, label: Cover image link, type: string, description: "Right-click the post's cover image, Copy image address, paste here." }

  - name: reviews
    label: Reviews
    description: The reviews section appears once at least one review is added.
    type: file
    path: data/reviews.json
    format: json
    fields:
      - name: reviews
        label: Reviews
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{date} {name}"
        fields:
          - { name: id, label: Review ID, type: string, required: true, description: "Unique code, e.g. r1, r2" }
          - { name: name, label: Name, type: string, required: true, description: "Masked, e.g. K****" }
          - { name: date, label: Date, type: date, required: true }
          - { name: trip, label: Tour ID, type: string, required: true, description: "ID of the tour, from Tours (e.g. gobi-4n5d)." }
          - { name: rating, label: Stars, type: number, required: true, options: { min: 1, max: 5 } }
          - name: lang
            label: Language
            type: select
            options: { values: [{ value: ko, label: Korean }, { value: en, label: English }] }
          - { name: text, label: Review text, type: text, required: true }
          - name: source
            label: Where it was posted
            type: select
            options:
              values:
                - { value: naver, label: Naver }
                - { value: google, label: Google }
                - { value: kakao, label: KakaoTalk }
                - { value: direct, label: Sent to us directly }
          - { name: url, label: Link (optional), type: string }

  - name: settings
    label: Contact and company
    type: file
    path: data/settings.json
    format: json
    fields:
      - { name: kakao, label: KakaoTalk channel chat link, type: string }
      - { name: kakaoId, label: KakaoTalk ID, type: string }
      - { name: email, label: Email, type: string }
      - name: whatsapp
        label: WhatsApp number
        type: string
        description: "Country code and number, digits only, e.g. 97699112233"
        pattern: { regex: "^[0-9]*$", message: "Digits only." }
      - { name: naverBlog, label: Naver blog link, type: string }
      - { name: instagram, label: Instagram link, type: string }
      - name: company
        label: Company details (shown in the footer)
        type: object
        fields:
          - { name: name, label: Company name, type: string }
          - { name: ceo, label: CEO, type: string }
          - { name: address, label: Address, type: string }
          - { name: regNo, label: Registration number, type: string }
          - { name: licenseNo, label: Travel license number, type: string }
          - { name: phone, label: Phone, type: string }
      - { name: formKey, label: Web3Forms access key, type: string, description: "Turns on the inquiry and review forms; messages go to the email the key was made with." }
      - { name: kakaoJsKey, label: Kakao JavaScript key, type: string, description: "Turns on the KakaoTalk share button." }
